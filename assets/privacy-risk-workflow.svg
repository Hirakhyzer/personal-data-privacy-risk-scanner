<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Privacy risk scanner workflow">
  <rect width="1400" height="720" rx="28" fill="#f8fafc"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>
  <style>.title{font:800 34px Arial,Helvetica,sans-serif;fill:#0f172a}.sub{font:500 15px Arial,Helvetica,sans-serif;fill:#475569}.step{font:800 18px Arial,Helvetica,sans-serif;fill:#0f172a}.txt{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}.num{font:800 18px Arial,Helvetica,sans-serif;fill:#fff}.arr{stroke:#0f172a;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="title" x="58" y="56">End-to-End Privacy Risk Workflow</text><text class="sub" x="58" y="84">A transparent pipeline for synthetic data creation, PII detection, privacy scoring, redaction planning, access review, and reproducible reporting.</text>
  <g filter="url(#sh)">
    <rect x="64" y="144" width="184" height="154" rx="22" fill="#eff6ff" stroke="#bfdbfe"/><circle cx="100" cy="184" r="20" fill="#2563eb"/><text class="num" x="100" y="190" text-anchor="middle">1</text><text class="step" x="128" y="184">Generate</text><text class="txt" x="96" y="222">Synthetic documents,</text><text class="txt" x="96" y="244">fictional identities,</text><text class="txt" x="96" y="266">and access events.</text>
    <rect x="304" y="144" width="184" height="154" rx="22" fill="#ecfeff" stroke="#99f6e4"/><circle cx="340" cy="184" r="20" fill="#0891b2"/><text class="num" x="340" y="190" text-anchor="middle">2</text><text class="step" x="368" y="184">Detect</text><text class="txt" x="336" y="222">PII spans, sensitive</text><text class="txt" x="336" y="244">phrases, medical, ID,</text><text class="txt" x="336" y="266">contact and location data.</text>
    <rect x="544" y="144" width="184" height="154" rx="22" fill="#faf5ff" stroke="#ddd6fe"/><circle cx="580" cy="184" r="20" fill="#7c3aed"/><text class="num" x="580" y="190" text-anchor="middle">3</text><text class="step" x="608" y="184">Score</text><text class="txt" x="576" y="222">Document-level risk,</text><text class="txt" x="576" y="244">risk drivers, severity</text><text class="txt" x="576" y="266">bands and summaries.</text>
    <rect x="784" y="144" width="184" height="154" rx="22" fill="#fff7ed" stroke="#fed7aa"/><circle cx="820" cy="184" r="20" fill="#d97706"/><text class="num" x="820" y="190" text-anchor="middle">4</text><text class="step" x="848" y="184">Redact</text><text class="txt" x="816" y="222">Mask, redact,</text><text class="txt" x="816" y="244">generalize, minimize,</text><text class="txt" x="816" y="266">or route for review.</text>
    <rect x="1024" y="144" width="184" height="154" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/><circle cx="1060" cy="184" r="20" fill="#16a34a"/><text class="num" x="1060" y="190" text-anchor="middle">5</text><text class="step" x="1088" y="184">Audit</text><text class="txt" x="1056" y="222">Role mismatch,</text><text class="txt" x="1056" y="244">after-hours access,</text><text class="txt" x="1056" y="266">critical data events.</text>
    <rect x="424" y="430" width="232" height="148" rx="22" fill="#ffffff" stroke="#cbd5e1"/><circle cx="464" cy="470" r="20" fill="#0f172a"/><text class="num" x="464" y="476" text-anchor="middle">6</text><text class="step" x="492" y="470">Human review</text><text class="txt" x="456" y="508">Inspect flagged findings,</text><text class="txt" x="456" y="530">validate redaction logic,</text><text class="txt" x="456" y="552">and approve release actions.</text>
    <rect x="744" y="430" width="232" height="148" rx="22" fill="#eef2ff" stroke="#c7d2fe"/><circle cx="784" cy="470" r="20" fill="#4f46e5"/><text class="num" x="784" y="476" text-anchor="middle">7</text><text class="step" x="812" y="470">Export evidence</text><text class="txt" x="776" y="508">CSV, JSON, Markdown,</text><text class="txt" x="776" y="530">figures, redaction plan,</text><text class="txt" x="776" y="552">and audit ledger.</text>
  </g>
  <path class="arr" d="M248 221 L304 221"/><path class="arr" d="M488 221 L544 221"/><path class="arr" d="M728 221 L784 221"/><path class="arr" d="M968 221 L1024 221"/><path class="arr" d="M1116 298 C1056 366 934 398 894 430"/><path class="arr" d="M876 298 C770 374 634 396 562 430"/><path class="arr" d="M656 504 L744 504"/>
  <rect x="170" y="634" width="1060" height="44" rx="22" fill="#0f172a"/><text x="700" y="662" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#e0f2fe">Outputs are review artifacts: they support privacy engineering decisions but do not replace counsel, DPO review, security approval, or legal compliance certification.</text>
</svg>