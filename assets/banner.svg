<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Personal Data Privacy Risk Scanner banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/><stop offset="52%" stop-color="#0f172a"/><stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="18%" r="75%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/></filter>
    <style>
      .title{font:800 56px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-1.1px}.accent{fill:#67e8f9}.sub{font:700 24px Arial,Helvetica,sans-serif;fill:#c4b5fd}.body{font:500 18px Arial,Helvetica,sans-serif;fill:#cbd5e1}.chip{font:800 14px Arial,Helvetica,sans-serif;fill:#eef2ff}.tiny{font:600 13px Arial,Helvetica,sans-serif;fill:#94a3b8}.panelTitle{font:800 16px Arial,Helvetica,sans-serif;fill:#e0f2fe}.panelText{font:700 12px Arial,Helvetica,sans-serif;fill:#cbd5e1}.kpi{font:800 30px Arial,Helvetica,sans-serif;fill:#ffffff}.label{font:700 11px Arial,Helvetica,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1400" height="460" rx="34" fill="url(#bg)"/><rect width="1400" height="460" rx="34" fill="url(#glow)"/>
  <g opacity="0.13" stroke="#a5b4fc" stroke-width="1" fill="none"><path d="M66 90 H250 M66 138 H182 M66 186 H240 M66 234 H166"/><path d="M92 86 L138 132 L220 132 M82 236 L145 236 L230 314"/><circle cx="260" cy="90" r="4" fill="#38bdf8"/><circle cx="230" cy="132" r="4" fill="#a78bfa"/><path d="M42 392 C190 340 338 410 500 350 C656 292 760 352 870 392"/></g>
  <g transform="translate(80 76)">
    <text class="title" x="0" y="0">Personal Data <tspan class="accent">Privacy Risk</tspan></text>
    <text class="title" x="0" y="66">Scanner</text>
    <text class="sub" x="0" y="122">Synthetic PII Detection • Risk Scoring • Redaction Planning • Audit Evidence</text>
    <text class="body" x="0" y="168">Research-grade privacy engineering lab for detecting sensitive information, classifying document risk,</text>
    <text class="body" x="0" y="194">recommending transparent redactions, and preserving human-reviewable audit trails.</text>
    <g transform="translate(0 244)">
      <rect x="0" y="0" width="132" height="40" rx="16" fill="#2563eb"/><text class="chip" x="66" y="26" text-anchor="middle">Synthetic Data</text>
      <rect x="152" y="0" width="136" height="40" rx="16" fill="#7c3aed"/><text class="chip" x="220" y="26" text-anchor="middle">PII Detection</text>
      <rect x="308" y="0" width="122" height="40" rx="16" fill="#0891b2"/><text class="chip" x="369" y="26" text-anchor="middle">Redaction</text>
      <rect x="450" y="0" width="132" height="40" rx="16" fill="#0f766e"/><text class="chip" x="516" y="26" text-anchor="middle">Audit Ledger</text>
      <rect x="602" y="0" width="142" height="40" rx="16" fill="#d97706"/><text class="chip" x="673" y="26" text-anchor="middle">Human Review</text>
    </g>
    <text class="tiny" x="0" y="338">Privacy-review support only — not legal certification, automatic disclosure approval, or a substitute for privacy counsel.</text>
  </g>
  <g transform="translate(910 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="320" rx="28" fill="#06111f" stroke="#38bdf8" stroke-width="2"/>
    <text class="panelTitle" x="30" y="42">Privacy Evidence Console</text>
    <g transform="translate(30 66)">
      <rect x="0" y="0" width="96" height="78" rx="16" fill="#0f172a" stroke="#334155"/><text class="kpi" x="48" y="40" text-anchor="middle">80</text><text class="label" x="48" y="60" text-anchor="middle">DOCS</text>
      <rect x="116" y="0" width="96" height="78" rx="16" fill="#0f172a" stroke="#334155"/><text class="kpi" x="164" y="40" text-anchor="middle">PII</text><text class="label" x="164" y="60" text-anchor="middle">ENTITIES</text>
      <rect x="232" y="0" width="96" height="78" rx="16" fill="#0f172a" stroke="#334155"/><text class="kpi" x="280" y="40" text-anchor="middle">4</text><text class="label" x="280" y="60" text-anchor="middle">RISK BANDS</text>
    </g>
    <g transform="translate(30 172)">
      <rect x="0" y="0" width="328" height="104" rx="18" fill="#0f172a" stroke="#334155"/>
      <text class="panelText" x="24" y="28">Detection → Risk → Redaction → Ledger</text>
      <rect x="24" y="48" width="72" height="12" rx="6" fill="#38bdf8"/><rect x="116" y="48" width="88" height="12" rx="6" fill="#a78bfa"/><rect x="224" y="48" width="66" height="12" rx="6" fill="#22c55e"/>
      <path d="M60 76 C120 34 182 92 260 52" fill="none" stroke="#67e8f9" stroke-width="3"/><circle cx="60" cy="76" r="5" fill="#67e8f9"/><circle cx="166" cy="70" r="5" fill="#a78bfa"/><circle cx="260" cy="52" r="5" fill="#22c55e"/>
    </g>
  </g>
</svg>