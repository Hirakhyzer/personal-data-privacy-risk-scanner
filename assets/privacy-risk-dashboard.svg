<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="Privacy scanner evidence dashboard">
  <rect width="1400" height="780" rx="30" fill="#07111f"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#172554"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/></filter></defs>
  <style>.title{font:800 32px Arial,Helvetica,sans-serif;fill:#f8fafc}.sub{font:500 14px Arial,Helvetica,sans-serif;fill:#94a3b8}.cardTitle{font:800 14px Arial,Helvetica,sans-serif;fill:#cbd5e1}.metric{font:800 36px Arial,Helvetica,sans-serif;fill:#fff}.small{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}.label{font:700 13px Arial,Helvetica,sans-serif;fill:#e2e8f0}.axis{font:500 11px Arial,Helvetica,sans-serif;fill:#64748b}</style>
  <rect x="30" y="30" width="1340" height="720" rx="28" fill="url(#g)" stroke="#334155"/>
  <text class="title" x="70" y="78">Privacy Risk Evidence Dashboard</text><text class="sub" x="70" y="104">Academic-style summary of synthetic sensitive-data detection, risk classes, redaction actions, access audit flags, and ledger integrity.</text>
  <g filter="url(#s)">
    <rect x="70" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="98" y="176">Document corpus</text><text class="metric" x="98" y="220">80</text><text class="small" x="158" y="213">synthetic files</text>
    <rect x="350" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="378" y="176">Sensitive entities</text><text class="metric" x="378" y="220">PII</text><text class="small" x="448" y="213">typed detections</text>
    <rect x="630" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="658" y="176">Redaction actions</text><text class="metric" x="658" y="220">4+</text><text class="small" x="720" y="213">review paths</text>
    <rect x="910" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="938" y="176">Audit ledger</text><text class="metric" x="938" y="220">HASH</text><text class="small" x="1042" y="213">chained log</text>
  </g>
  <g filter="url(#s)">
    <rect x="70" y="310" width="560" height="330" rx="24" fill="#0f172a" stroke="#334155"/>
    <text class="label" x="104" y="350">Entity-type detection mix</text><text class="small" x="104" y="372">Representative README visual; real charts are generated locally by the script.</text>
    <g transform="translate(106 418)"><text class="axis" x="0" y="14">Email</text><rect x="105" y="0" width="330" height="18" rx="9" fill="#1e293b"/><rect x="105" y="0" width="292" height="18" rx="9" fill="#38bdf8"/><text class="axis" x="450" y="14">high</text><text class="axis" x="0" y="54">Phone</text><rect x="105" y="40" width="330" height="18" rx="9" fill="#1e293b"/><rect x="105" y="40" width="250" height="18" rx="9" fill="#a78bfa"/><text class="axis" x="0" y="94">Address</text><rect x="105" y="80" width="330" height="18" rx="9" fill="#1e293b"/><rect x="105" y="80" width="210" height="18" rx="9" fill="#22c55e"/><text class="axis" x="0" y="134">Medical</text><rect x="105" y="120" width="330" height="18" rx="9" fill="#1e293b"/><rect x="105" y="120" width="168" height="18" rx="9" fill="#f59e0b"/><text class="axis" x="0" y="174">ID-like</text><rect x="105" y="160" width="330" height="18" rx="9" fill="#1e293b"/><rect x="105" y="160" width="132" height="18" rx="9" fill="#ef4444"/></g>
    <rect x="700" y="310" width="560" height="330" rx="24" fill="#0f172a" stroke="#334155"/>
    <text class="label" x="734" y="350">Risk and review queue</text><text class="small" x="734" y="372">Risk classes inform human review priority; no automatic disclosure decisions.</text>
    <g transform="translate(744 420)"><circle cx="82" cy="82" r="74" fill="none" stroke="#1e293b" stroke-width="22"/><path d="M82 8 A74 74 0 0 1 151 108" fill="none" stroke="#ef4444" stroke-width="22" stroke-linecap="round"/><path d="M151 108 A74 74 0 0 1 72 155" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/><path d="M72 155 A74 74 0 0 1 24 36" fill="none" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/><text class="metric" x="82" y="90" text-anchor="middle">RISK</text></g>
    <g transform="translate(930 416)"><rect x="0" y="0" width="260" height="52" rx="14" fill="#172554"/><text class="label" x="18" y="22">High risk documents</text><text class="small" x="18" y="40">review before release</text><rect x="0" y="70" width="260" height="52" rx="14" fill="#422006"/><text class="label" x="18" y="92">Unusual access</text><text class="small" x="18" y="110">after-hours / role mismatch</text><rect x="0" y="140" width="260" height="52" rx="14" fill="#064e3b"/><text class="label" x="18" y="162">Ledger verified</text><text class="small" x="18" y="180">hash-chained audit trail</text></g>
  </g>
  <rect x="180" y="690" width="1040" height="36" rx="18" fill="#020617"/><text x="700" y="713" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#e0f2fe">Synthetic lab outputs: entity tables • document-risk scores • redaction plans • access audit • figures • Markdown report • JSON summary • JSONL ledger</text>
</svg>