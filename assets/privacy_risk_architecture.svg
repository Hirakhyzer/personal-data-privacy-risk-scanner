<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="Academic privacy risk scanner system architecture">
  <rect width="1400" height="780" rx="28" fill="#f8fafc"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker><marker id="dash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>
  <style>.title{font:800 34px Arial,Helvetica,sans-serif;fill:#0f172a}.sub{font:500 15px Arial,Helvetica,sans-serif;fill:#475569}.boxTitle{font:800 18px Arial,Helvetica,sans-serif;fill:#0f172a}.boxText{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}.tag{font:800 12px Arial,Helvetica,sans-serif;fill:#fff}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.feed{stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#dash)}</style>
  <text class="title" x="58" y="56">Privacy Risk Scanner — System Architecture</text>
  <text class="sub" x="58" y="84">Synthetic documents and access events flow through transparent detection, scoring, redaction planning, human review, and auditable evidence outputs.</text>
  <g filter="url(#s)">
    <rect x="58" y="140" width="245" height="150" rx="22" fill="#eff6ff" stroke="#bfdbfe"/><text class="boxTitle" x="86" y="176">1. Synthetic corpus</text><text class="boxText" x="86" y="204">Fictional documents, people,</text><text class="boxText" x="86" y="224">identifiers, roles, access events,</text><text class="boxText" x="86" y="244">and privacy-sensitive phrases.</text><rect x="86" y="258" width="132" height="24" rx="12" fill="#2563eb"/><text class="tag" x="152" y="275" text-anchor="middle">NO REAL PII</text>
    <rect x="380" y="140" width="245" height="150" rx="22" fill="#ecfeff" stroke="#99f6e4"/><text class="boxTitle" x="408" y="176">2. Entity detection</text><text class="boxText" x="408" y="204">Regex, dictionaries, context rules,</text><text class="boxText" x="408" y="224">confidence labels, spans, and</text><text class="boxText" x="408" y="244">entity-level traceability.</text><rect x="408" y="258" width="140" height="24" rx="12" fill="#0891b2"/><text class="tag" x="478" y="275" text-anchor="middle">DETECTORS</text>
    <rect x="702" y="140" width="245" height="150" rx="22" fill="#faf5ff" stroke="#ddd6fe"/><text class="boxTitle" x="730" y="176">3. Risk scoring</text><text class="boxText" x="730" y="204">Weighted entity sensitivity,</text><text class="boxText" x="730" y="224">document type, access context,</text><text class="boxText" x="730" y="244">and risk-driver explanation.</text><rect x="730" y="258" width="128" height="24" rx="12" fill="#7c3aed"/><text class="tag" x="794" y="275" text-anchor="middle">RISK BANDS</text>
    <rect x="1024" y="140" width="245" height="150" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text class="boxTitle" x="1052" y="176">4. Redaction plan</text><text class="boxText" x="1052" y="204">Mask, redact, generalize,</text><text class="boxText" x="1052" y="224">minimize, or route to privacy</text><text class="boxText" x="1052" y="244">review before disclosure.</text><rect x="1052" y="258" width="136" height="24" rx="12" fill="#d97706"/><text class="tag" x="1120" y="275" text-anchor="middle">ACTION PLAN</text>
    <rect x="190" y="448" width="255" height="150" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/><text class="boxTitle" x="218" y="484">5. Access audit</text><text class="boxText" x="218" y="512">Role mismatch, after-hours,</text><text class="boxText" x="218" y="532">critical-document access,</text><text class="boxText" x="218" y="552">and suspicious review flags.</text><rect x="218" y="566" width="124" height="24" rx="12" fill="#16a34a"/><text class="tag" x="280" y="583" text-anchor="middle">ACCESS</text>
    <rect x="572" y="448" width="255" height="150" rx="22" fill="#ffffff" stroke="#cbd5e1"/><text class="boxTitle" x="600" y="484">6. Human review</text><text class="boxText" x="600" y="512">Privacy decision support,</text><text class="boxText" x="600" y="532">not automatic compliance</text><text class="boxText" x="600" y="552">or release approval.</text><rect x="600" y="566" width="150" height="24" rx="12" fill="#0f172a"/><text class="tag" x="675" y="583" text-anchor="middle">GOVERNANCE</text>
    <rect x="954" y="448" width="255" height="150" rx="22" fill="#eef2ff" stroke="#c7d2fe"/><text class="boxTitle" x="982" y="484">7. Evidence outputs</text><text class="boxText" x="982" y="512">CSV, JSON, Markdown reports,</text><text class="boxText" x="982" y="532">figures, redaction previews,</text><text class="boxText" x="982" y="552">and hash-chained ledger.</text><rect x="982" y="566" width="130" height="24" rx="12" fill="#4f46e5"/><text class="tag" x="1047" y="583" text-anchor="middle">AUDITABLE</text>
  </g>
  <path class="arr" d="M303 215 L380 215"/><path class="arr" d="M625 215 L702 215"/><path class="arr" d="M947 215 L1024 215"/><path class="arr" d="M1148 290 C1108 374 1032 405 990 448"/><path class="arr" d="M502 290 C426 352 360 390 322 448"/><path class="arr" d="M445 523 L572 523"/><path class="arr" d="M827 523 L954 523"/><path class="feed" d="M1080 598 C1000 694 474 694 318 598"/>
  <rect x="92" y="670" width="1216" height="48" rx="24" fill="#0f172a"/><text x="700" y="701" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#e0f2fe">Design principle: every sensitive-data finding is traceable to a detector, every risk score is reviewable, and every release decision remains human-governed.</text>
</svg>